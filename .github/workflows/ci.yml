name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: tenderfit
          POSTGRES_PASSWORD: tenderfit
          POSTGRES_DB: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U tenderfit" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      # With this set, a missing database fails the run: tests that need it cannot quietly disappear.
      REQUIRE_DB: "1"
      TEST_ADMIN_DATABASE_URL: postgresql://tenderfit:tenderfit@localhost:5432/postgres
      TEST_DATABASE_URL: postgresql://tenderfit:tenderfit@localhost:5432/tenderfit_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install torch --index-url https://download.pytorch.org/whl/cpu
      - run: pip install -e '.[dev]'
      - run: ruff check tenderfit tests scripts
      - run: pytest -q -ra

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run build

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose -f docker-compose.yml -f docker-compose.demo.yml config -q
