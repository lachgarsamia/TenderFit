[project]
name = "tenderfit"
version = "0.0.1"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.8",
    "pydantic-settings>=2.4",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "pymupdf>=1.24",
    "python-docx>=1.1",
    "rapidfuzz>=3.9",
    "python-multipart>=0.0.9",
    "anthropic>=1.0",
    "sentence-transformers>=3.0",
    "pgvector>=0.3",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "respx>=0.21", "hypothesis>=6", "ruff>=0.6", "mypy>=1.11"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["tenderfit*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning:importlib._bootstrap"]
markers = ["agent: runs with agent escalation enabled"]

[tool.ruff]
line-length = 170
extend-exclude = ["web"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E731", "E501", "E741"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
packages = ["tenderfit"]
